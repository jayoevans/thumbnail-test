name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same environment as the deploy job, so secrets defined on the
    # "github-pages" environment are visible to the build too.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Each value may be a repository/environment secret or a variable.
          VITE_SHEET_ENDPOINT: ${{ secrets.VITE_SHEET_ENDPOINT || vars.VITE_SHEET_ENDPOINT }}
          VITE_RESULTS_KEY: ${{ secrets.VITE_RESULTS_KEY || vars.VITE_RESULTS_KEY }}
      - name: Check build inputs
        run: |
          echo "VITE_SHEET_ENDPOINT set: ${{ (secrets.VITE_SHEET_ENDPOINT || vars.VITE_SHEET_ENDPOINT) != '' }}"
          echo "VITE_RESULTS_KEY set:    ${{ (secrets.VITE_RESULTS_KEY || vars.VITE_RESULTS_KEY) != '' }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
